name: PC Preis-Tracker & Dashboard

on:
  schedule:
    - cron: '0 8 * * *'  # Läuft täglich um 09:00 Uhr UTC
  workflow_dispatch:      # Manueller Start-Button

permissions:
  contents: write         # Erlaubt das Speichern der History
  pages: write            # NEU: Erlaubt das Hochladen auf GitHub Pages
  id-token: write         # NEU: Nötig für die sichere Authentifizierung

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Skript ausführen & Dashboard generieren
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py

      - name: Änderungen (Dashboard & History) auf GitHub speichern
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Tägliches Dashboard & History-Update durch KI-Tracker"
          git push origin HEAD:main

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Dashboard als Artifact hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Lädt den gesamten Ordner inkl. index.html hoch

  # Dieser neue Job lädt das Artifact auf die Webseite hoch
  deploy-pages:
    needs: run-tracker
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
