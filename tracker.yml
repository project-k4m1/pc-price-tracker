name: PC Preis-Tracker & Dashboard

on:
  schedule:
    - cron: '0 9 * * *'  # Läuft täglich um 09:00 Uhr UTC
  workflow_dispatch:      # Manueller Start-Button

permissions:
  contents: write         # Erlaubt dem Skript, Dateien hochzuladen

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Skript ausführen & Dashboard generieren
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py

      - name: Änderungen (Dashboard & History) auf GitHub speichern
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Tägliches Dashboard & History-Update durch KI-Tracker"
          git push origin HEAD:main
